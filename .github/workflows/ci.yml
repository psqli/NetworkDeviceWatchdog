name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetworkDeviceWatchdog.slnx

      # Builds both targets everywhere: net10.0 and net10.0-windows (WinForms tray UI).
      - name: Build
        run: dotnet build NetworkDeviceWatchdog.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test NetworkDeviceWatchdog.slnx --no-build -c Release
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-and-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            framework: net10.0-windows
            os: windows-latest
          - rid: linux-x64
            framework: net10.0
            os: ubuntu-latest
          - rid: linux-arm64
            framework: net10.0
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained single file
        run: >
          dotnet publish src/NetworkDeviceWatchdog/NetworkDeviceWatchdog.csproj
          -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Add sample configuration and readme
        shell: bash
        run: |
          cp samples/watchdog.json publish/${{ matrix.rid }}/watchdog.sample.json
          cp README.md publish/${{ matrix.rid }}/
          rm -f publish/${{ matrix.rid }}/*.pdb

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkDeviceWatchdog-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
